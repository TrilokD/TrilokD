<svg width="1200" height="220" viewBox="0 0 1200 220"
     xmlns="http://www.w3.org/2000/svg">

  <!-- transparent background -->

  <!-- outer frame -->
  <rect x="20" y="20" width="1160" height="180" rx="22"
        fill="none"
        stroke="#7C83FF"
        stroke-width="1.5"
        opacity="0.55"/>

  <!-- left waveform -->
  <path d="M40 115
           C80 115, 90 75, 125 75
           S170 125, 205 125
           S245 90, 275 105"
        fill="none"
        stroke="#7C83FF"
        stroke-width="1.5"
        opacity="0.7"/>

  <path d="M40 125
           C85 125, 95 88, 130 88
           S170 112, 205 112
           S240 95, 275 105"
        fill="none"
        stroke="#A7ABFF"
        stroke-width="1"
        opacity="0.55"/>

  <circle cx="275" cy="105" r="4" fill="#7C83FF"/>

  <!-- right waveform -->
  <g transform="translate(1200 0) scale(-1 1)">
    <path d="M40 115
             C80 115, 90 75, 125 75
             S170 125, 205 125
             S245 90, 275 105"
          fill="none"
          stroke="#7C83FF"
          stroke-width="1.5"
          opacity="0.7"/>

    <path d="M40 125
             C85 125, 95 88, 130 88
             S170 112, 205 112
             S240 95, 275 105"
          fill="none"
          stroke="#A7ABFF"
          stroke-width="1"
          opacity="0.55"/>

    <circle cx="275" cy="105" r="4" fill="#7C83FF"/>
  </g>

  <!-- separators -->
  <line x1="330" y1="78" x2="330" y2="142"
        stroke="#7C83FF" opacity="0.45"/>

  <line x1="870" y1="78" x2="870" y2="142"
        stroke="#7C83FF" opacity="0.45"/>

  <!-- wordmark -->
  <text x="600" y="95"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        fill="#7C83FF">
    TrilokD
  </text>

  <!-- tagline -->
  <text x="600" y="128"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        letter-spacing="1.5"
        fill="#7C83FF">
    models are powerful. systems make them useful.
  </text>

  <!-- footer -->
  <text x="600" y="158"
        text-anchor="middle"
        font-family="monospace"
        font-size="10"
        letter-spacing="3"
        fill="#7C83FF"
        opacity="0.75">
    BUILD / EXPLORE / IMPROVE / REPEAT
  </text>

</svg>